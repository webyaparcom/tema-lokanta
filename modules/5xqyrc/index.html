<section class="modulex-ik3" id="ik3-{{id}}" data-ik3-kopyalandi="{{copiedText}}">
  <div class="modulex-ik3-wrap">
    <div class="modulex-ik3-sol">
      {{ik3title}}
      {{ik3desc}}
      {{ik3saat}}
    </div>
    <div class="modulex-ik3-sag">
      {{ik3liste}}
      <p class="modulex-ik3-sr" role="status" aria-live="polite" data-ik3-durum></p>
    </div>
  </div>
</section>

<style>
  /* İletişim Bilgi Paneli (iletisim-kartlari-3). Renkler yalnız desing token'ı. */
  .modulex-ik3 {
    box-sizing: border-box; width: 100%;
    padding-block: clamp(36px, 6vw, 80px); padding-inline: clamp(16px, 4vw, 32px);
    background: --bgcolor--; color: --textcolor--;
  }
  .modulex-ik3 *, .modulex-ik3 *::before, .modulex-ik3 *::after { box-sizing: border-box; }
  .modulex-ik3 :where(span:not(.material-symbols-outlined), bdi, b, strong, em) { font: inherit; }
  .modulex-ik3-wrap {
    max-width: --max--; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: clamp(24px, 5vw, 72px); align-items: start;
  }
  .modulex-ik3-title { margin: 0 0 10px; font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.4rem); line-height: 1.2; color: --textcolor--; }
  .modulex-ik3-desc { margin: 0 0 24px; line-height: 1.7; color: --mutedcolor--; }
  .modulex-ik3-saat { padding: 20px; border-radius: --radius--; background: --surface--; }
  .modulex-ik3-saath { margin: 0 0 10px; font-size: 1rem; color: --textcolor--; }
  .modulex-ik3-tablo { width: 100%; border-collapse: collapse; }
  .modulex-ik3-tablo th, .modulex-ik3-tablo td { padding: 8px 0; border-bottom: 1px solid --bordercolor--; text-align: start; font-weight: 400; }
  .modulex-ik3-tablo td { text-align: end; font-variant-numeric: tabular-nums; }
  .modulex-ik3-tablo tr:last-child th, .modulex-ik3-tablo tr:last-child td { border-bottom: 0; }

  .modulex-ik3-dl { margin: 0; border-top: 2px solid --textcolor--; }
  .modulex-ik3-satir {
    display: grid; grid-template-columns: minmax(120px, 3fr) minmax(0, 9fr); gap: 16px; align-items: center;
    padding-block: 18px; border-bottom: 1px solid --bordercolor--;
  }
  .modulex-ik3-dt { display: flex; align-items: center; gap: 10px; font-weight: 700; color: --mutedcolor--; }
  .modulex-ik3-dt .material-symbols-outlined { color: --accent--; }
  .modulex-ik3-dd { margin: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; min-width: 0; }
  .modulex-ik3-deger { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
  .modulex-ik3-eylemler { display: inline-flex; align-items: center; gap: 8px; }
  .modulex-ik3 a.modulex-ik3-eylem, .modulex-ik3 a.modulex-ik3-eylem:visited {
    display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px;
    background: --accent--; color: --accentText--; font-weight: 700; font-size: 0.92rem; text-decoration: none; white-space: nowrap;
  }
  .modulex-ik3-kopya {
    display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid --bordercolor--; background: transparent; color: --textcolor--; cursor: pointer;
  }
  .modulex-ik3-kopya:hover { background: --surface--; }
  .modulex-ik3-kopya[data-ik3-ok="1"] { border-color: --accent--; color: --accent--; }
  .modulex-ik3 a:focus-visible, .modulex-ik3-kopya:focus-visible { outline: 3px solid --accent--; outline-offset: 2px; }
  .modulex-ik3-bos { margin: 0; padding: 20px; border: 1px dashed --bordercolor--; border-radius: --radius--; color: --mutedcolor--; }
  .modulex-ik3-sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }

  @media (max-width: 860px) {
    .modulex-ik3-wrap { grid-template-columns: 1fr; }
    .modulex-ik3-satir { grid-template-columns: 1fr; gap: 6px; }
    [class*="modulex"] { max-width: 100%; box-sizing: border-box; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ik3 *, .modulex-ik3 *::before, .modulex-ik3 *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
  /* Kopyala düğmeleri yalnız Clipboard API varsa görünür; sonuç aria-live ile duyurulur. */
  (function () {
    var kok = document.getElementById("ik3-{{id}}");
    if (!kok || kok.getAttribute("data-ik3-hazir") === "1") { return; }
    kok.setAttribute("data-ik3-hazir", "1");
    if (!navigator.clipboard || !window.isSecureContext) { return; }
    var durum = kok.querySelector("[data-ik3-durum]");
    var dugmeler = kok.querySelectorAll("[data-ik3-kopya]");
    var i;
    for (i = 0; i < dugmeler.length; i++) {
      dugmeler[i].hidden = false;
      dugmeler[i].addEventListener("click", function () {
        var b = this;
        navigator.clipboard.writeText(b.getAttribute("data-ik3-kopya") || "").then(function () {
          b.setAttribute("data-ik3-ok", "1");
          if (durum) { durum.textContent = ""; durum.textContent = kok.getAttribute("data-ik3-kopyalandi") || ""; }
          setTimeout(function () { b.removeAttribute("data-ik3-ok"); }, 1600);
        });
      });
    }
  })();
</script>
