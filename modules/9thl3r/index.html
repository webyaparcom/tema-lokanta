  .modulex-yorum-sohbet-balon-harf { display: inline-grid; place-items: center; background: color-mix(in srgb, --accent-- 18%, --kartBg--); color: --accentInk--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-yorum-sohbet-balon-yazar { display: flex; align-items: center; gap: 12px; }

  .modulex-yorum-sohbet-balon-akis { display: grid; gap: 22px; max-width: 880px; margin-inline: auto; }

  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-yorum-sohbet-balon *, .modulex-yorum-sohbet-balon *::before, .modulex-yorum-sohbet-balon *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-yorum-sohbet-balon";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
